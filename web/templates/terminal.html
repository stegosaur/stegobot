{% extends "base.html" %}
{% block title %}StegoBot — Terminal{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='xterm.css') }}">
<script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
<script src="{{ url_for('static', filename='xterm.js') }}"></script>
<script src="{{ url_for('static', filename='xterm-addon-fit.js') }}"></script>
<style>
  /* Override base layout for full-height terminal */
  main { padding: 0; height: calc(100vh - 38px); display: flex; flex-direction: column; overflow: hidden; }
  #irc-wrap { display: flex; flex: 1; min-height: 0; }

  #win-list {
    width: 170px; min-width: 170px;
    background: #111; border-right: 1px solid #2e2e2e;
    overflow-y: auto; display: flex; flex-direction: column;
  }
  .win-section { font-size: .8em; color: #555; padding: .4rem .6rem .1rem; text-transform: uppercase; letter-spacing: .06em; }
  .win-item {
    padding: .3rem .7rem; cursor: pointer; font-size: .9em;
    color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-left: 2px solid transparent;
  }
  .win-item:hover { color: #aaa; background: #1a1a1a; }
  .win-item.active { color: #4ec94e; border-left-color: #4ec94e; background: #1a1a1a; }
  .win-item.unread { color: #e5c07b; }
  .win-item.unread-mention { color: #e06c75; font-weight: bold; }

  #irc-center { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #topic-bar {
    background: #1a1a1a; border-bottom: 1px solid #2e2e2e;
    padding: .3rem .7rem; font-size: .95em; color: #56b6c2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-height: 28px;
  }

  #term-container { flex: 1; overflow: hidden; position: relative; background: #0d0d0d; }
  .term-pane { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; padding: 4px 6px; }
  .term-pane.active { display: block; }
  .xterm { height: 100% !important; }
  .xterm-viewport { border-radius: 0 !important; }

  #input-bar {
    display: flex; align-items: center; gap: .4rem;
    background: #111; border-top: 1px solid #2e2e2e;
    padding: .3rem .5rem;
  }
  #input-prompt { color: #4ec94e; font-size: 1em; white-space: nowrap; font-family: monospace; }
  #irc-input {
    flex: 1; background: transparent; border: none; color: #d4d4d4;
    font-family: 'Cascadia Code','Fira Mono',monospace; font-size: 17px; outline: none;
  }

  #names-panel {
    width: 160px; min-width: 160px;
    background: #111; border-left: 1px solid #2e2e2e;
    overflow-y: auto; font-size: .88em; padding: .3rem 0;
  }
  .names-section { color: #f00; padding: .2rem .6rem; font-size: .85em; }
  .name-entry {
    padding: .2rem .6rem; color: #888; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: none;
  }
  .name-entry:hover { background: #1a1a1a; color: #ccc; }
  .name-op    { color: #e5c07b; }
  .name-voice { color: #56b6c2; }

  /* Context menu */
  #ctx-menu {
    display: none; position: fixed; z-index: 9999;
    background: #1e1e1e; border: 1px solid #3e3e3e; border-radius: 4px;
    box-shadow: 2px 4px 12px rgba(0,0,0,.6);
    min-width: 140px; font-size: .82em;
  }
  #ctx-menu .ctx-nick {
    padding: .4rem .7rem; color: #61afef; font-weight: bold;
    border-bottom: 1px solid #2e2e2e; cursor: default;
  }
  #ctx-menu .ctx-item {
    padding: .3rem .7rem; color: #ccc; cursor: pointer;
  }
  #ctx-menu .ctx-item:hover { background: #2e2e2e; color: #fff; }
  #ctx-menu .ctx-sep { border-top: 1px solid #2e2e2e; margin: .2rem 0; }
  #ctx-menu .ctx-danger { color: #e06c75; }
  #ctx-menu .ctx-danger:hover { background: #3a1010; }
</style>
{% endblock %}
{% block content %}
<div id="irc-wrap">

  <div id="win-list">
    <div class="win-section">Windows</div>
    <div class="win-item active" data-win="*status*" onclick="switchWin('*status*')">*status*</div>
    <div class="win-section">Channels</div>
    {% for ch in channels %}
    <div class="win-item {% if ch==active %}active{% endif %}"
         data-win="{{ ch }}" onclick="switchWin('{{ ch }}')">{{ ch }}</div>
    {% endfor %}
  </div>

  <div id="irc-center">
    <div id="topic-bar"></div>
    <div id="term-container"></div>
    <div id="input-bar">
      <span id="input-prompt">[*status*]</span>
      <input id="irc-input" type="text" autocomplete="off"
             placeholder="message or /command …" spellcheck="false">
    </div>
  </div>

  <div id="names-panel"></div>
</div>

<!-- Right-click context menu -->
<div id="ctx-menu">
  <div class="ctx-nick" id="ctx-nick-label"></div>
  <div class="ctx-item" data-action="whois">Whois</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="op">Op</div>
  <div class="ctx-item" data-action="deop">Deop</div>
  <div class="ctx-item" data-action="voice">Voice</div>
  <div class="ctx-item" data-action="devoice">Devoice</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item ctx-danger" data-action="kick">Kick</div>
  <div class="ctx-item ctx-danger" data-action="kickban">Kick + Ban</div>
  <div class="ctx-item ctx-danger" data-action="ban">Ban</div>
  <div class="ctx-item" data-action="unban">Unban</div>
</div>

<script src="{{ url_for('static', filename='terminal.js') }}"></script>
<script>
  initTerminal({{ channels|tojson }}, {{ active|tojson }});
</script>
{% endblock %}
